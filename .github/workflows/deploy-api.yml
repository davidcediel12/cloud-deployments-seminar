# CI/CD for the API: build the image (CI), push it to Docker Hub and deploy it to Azure Container Apps (CD).
# Setup (Docker Hub token, Azure login, variables): see the README, section 8.

name: api

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/deploy-api.yml"] # only when the API changes
  pull_request: # build only: checks the change compiles, deploys nothing
    paths: ["api/**"]
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read
  id-token: write # lets azure/login get a short-lived token (OIDC): no Azure password stored in GitHub

concurrency: # one deploy at a time; a newer run waits for the current one
  group: deploy-api
  cancel-in-progress: false

env:
  # Tagged with the commit SHA: every image is traceable to its code, and rollback = deploy an older SHA.
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME || 'local' }}/seminar-api:${{ github.sha }}
  # Push and deploy only on main (not on pull requests) and once Docker Hub is configured.
  PUBLISH: ${{ github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }} # an access token, stored as a repository secret
      - name: Build (and push)
        uses: docker/build-push-action@v7
        with:
          context: ./api
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE }}
          build-args: VERSION=${{ github.sha }} # shown in /api/message: which commit is running

  deploy:
    needs: build # runs only if the build succeeded
    # Skipped until the Azure variables are set, so the workflow doesn't fail before setup.
    if: github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != '' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check the settings
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
        run: |
          missing=0
          for name in AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP CONTAINER_APP_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Variable $name is not set (Settings → Secrets and variables → Actions → Variables)"
              missing=1
            fi
          done
          exit $missing
      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the new image to the Container App
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$IMAGE"
