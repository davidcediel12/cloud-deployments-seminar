# Template for the database Secret. Copy it, fill in the real value, apply it:
#
#   cp k8s/secret.example.yaml k8s/secret.yaml   # secret.yaml is in .gitignore: never commit it
#   kubectl apply -f k8s/secret.yaml
#
# Or skip the file and create it from the command line:
#
#   kubectl create secret generic db-secret --from-literal=url='postgres://...'
#
# Kubernetes stores Secrets base64-encoded, not encrypted: anyone who can read Secrets in the cluster can read it.

apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
stringData: # plain text here; Kubernetes encodes it when storing
  # Azure Database for PostgreSQL needs TLS: add ?sslmode=require
  url: postgres://<user>:<password>@<host>:5432/<database>?sslmode=require
